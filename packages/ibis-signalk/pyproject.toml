[project]
name = "ibis-signalk"
version = "0.1.4"
description = "Ibis backend for the SignalK History API — code-less data discovery over marine sensor data"
readme = "README.md"
requires-python = ">=3.14"
# The Data Lab notebook installs this wheel in the browser, where pyarrow,
# pandas and altair come from Pyodide's own builds (Pyodide 314: pyarrow 22.0,
# pandas 3.0.2, altair 6.0), so the floors must not go above those versions.
# pyarrow-hotfix does nothing on pyarrow 14 or later, but ibis 12 still runs
# `import pyarrow_hotfix` whenever it handles Arrow data (ibis/formats/pyarrow.py)
# while only listing it under its own backends' extras, so without it ibis
# fails with "No module named 'pyarrow_hotfix'". Drop it once ibis stops
# importing it.
dependencies = ["ibis-framework>=12.0.0", "pyarrow>=22.0.0", "pyarrow-hotfix>=0.6", "pandas>=3.0.0", "altair>=6.0.0"]

[project.optional-dependencies]
# Runs queries the History API can't answer (joins, histograms) locally. DuckDB
# needs pytz to return timezone-aware timestamps, but doesn't install it itself
duckdb = ["ibis-framework[duckdb]>=12.0.0", "pytz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.15"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibis_signalk"]

[dependency-groups]
dev = ["ibis-signalk[duckdb]", "marimo>=0.25.2", "pytest"]

[tool.uv]
exclude-newer = "5 days"
# signalk-cli is our own package (npm run lab adds it via this project), so new
# releases can be used straight away
exclude-newer-package = { signalk-cli = false }
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
prerelease = "disallow"
prerelease-package = {}
