[project]
name = "ibis-signalk"
version = "0.1.1"
description = "Ibis backend for the SignalK History API — code-less data discovery over marine sensor data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ibis-framework>=12.0.0",
    "pyarrow>=17.0.0",
    "pyarrow-hotfix>=0.6",
    "pandas>=2.0.0",
    "altair>=6.2.1",
]

[project.optional-dependencies]
# Runs queries the History API can't answer (joins, histograms) locally
duckdb = ["ibis-framework[duckdb]>=12.0.0"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibis_signalk"]

[dependency-groups]
dev = [
    "ibis-signalk[duckdb]",
    "marimo>=0.24.0",
    "pytest",
]

[tool.uv]
exclude-newer = "5 days"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
prerelease = "disallow"
prerelease-package = {}
