[settings]
# Cooldown for tool upgrades (policies/project_standards.md in rhizomatics/hq)
minimum_release_age = "7d"

[tools]
node = "lts"
oxfmt = "latest"
# npm backend, not the aqua default: aqua's oxc monorepo tag mapping (oxlint_v/apps_v)
# breaks `latest` resolution under minimum_release_age
"npm:oxlint" = "latest"
prek = "latest"
