name: SignalK Plugin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Nothing by default; the job grants what the upstream workflow needs.
permissions: {}

jobs:
  test:
    permissions:
      contents: read
    # SignalK's shared plugin CI, pinned to a commit of master, where it is maintained
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@a99f838a61bdbe8806e3b181aa62bb0cae353ec2
    with:
      build-command: 'curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="$HOME/.local/bin:$PATH" && npm run build:ts && npm run build:wasm'
      enable-armv7: true
      format-check-command: npm run fmt:check
      coverage-command: npm run coverage
